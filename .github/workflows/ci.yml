name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan full git history
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --no-banner --redact -v

  quality:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kmsdc
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: kmsdc_test
        ports: ['5442:5432']
        options: >-
          --health-cmd "pg_isready -U kmsdc -d kmsdc_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6389:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # CI-only values for throwaway service containers — not real credentials.
      TEST_DATABASE_URL: postgresql://kmsdc:ci-only-password@localhost:5442/kmsdc_test
      DATABASE_URL: postgresql://kmsdc:ci-only-password@localhost:5442/kmsdc_test
      REDIS_URL: redis://localhost:6389
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Enable database extensions
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          PGPASSWORD=ci-only-password psql -h localhost -p 5442 -U kmsdc -d kmsdc_test \
            -c 'CREATE EXTENSION IF NOT EXISTS btree_gist; CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS citext;'
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Design-token contrast (WCAG AA)
        run: pnpm check:contrast
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Dependency audit (high and above)
        run: pnpm audit --audit-level high
        continue-on-error: true

  e2e:
    name: E2E, accessibility & responsive checks (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_APP_ENV: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@kmsdc/web...
      - run: pnpm --filter @kmsdc/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload screenshots for visual review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7
